# CodeQL: GitHub's own code reader, looking for real bugs in the Grove's code: a path that
# escapes its folder, user text reaching a shell, unsafe handling of what the hook listener
# receives. Also reads the workflow files themselves.
#
# Advisory. Findings appear under the repository's Security tab and on pull requests, but do not
# block a merge: CodeQL is sometimes wrong, and each finding deserves a read rather than a red X.
# The job itself fails only if CodeQL cannot run.
#
# No build step: TypeScript and workflow files are read as they are.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 6 * * 1'

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Needed to upload findings to the Security tab.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
